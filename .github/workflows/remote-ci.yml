name: Consulting Opportunities CI and Versioned Artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Read Consulting Opportunities version
        id: consulting-opportunities-version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version '$VERSION' must use stable SemVer format X.Y.Z."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Consulting Opportunities version: $VERSION"

      - name: Validate version against latest tag
        id: validate-version
        shell: bash
        env:
          VERSION: ${{ steps.consulting-opportunities-version.outputs.version }}
        run: |
          git fetch --tags --force

          TAGS="$(git tag --list 'v[0-9]*')"
          LATEST_TAG=""

          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              if [[ -z "$LATEST_TAG" ]] ||
                 [[ "$(printf '%s\n%s\n' "${LATEST_TAG#v}" "${TAG#v}" | sort -V | tail -n 1)" == "${TAG#v}" ]]; then
                LATEST_TAG="$TAG"
              fi
            fi
          done <<< "$TAGS"

          if [[ -z "$LATEST_TAG" ]]; then
            echo "No existing SemVer tag found. Version $VERSION can be the initial release."
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_VERSION="${LATEST_TAG#v}"

          echo "Latest tag: $LATEST_TAG"
          echo "package.json version: $VERSION"

          HIGHEST_VERSION="$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n 1)"

          if [[ "$HIGHEST_VERSION" != "$VERSION" || "$VERSION" == "$LATEST_VERSION" ]]; then
            echo "::error::Version $VERSION must be greater than latest tag $LATEST_TAG."
            exit 1
          fi

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Consulting Opportunities
        run: npm run build

      - name: Verify federation entry exists
        run: test -f dist/consultingOpportunitiesEntry.js

      - name: Package versioned artifact
        shell: bash
        env:
          VERSION: ${{ steps.consulting-opportunities-version.outputs.version }}
        run: |
          mkdir -p "release/remotes/consultingOpportunities/$VERSION"
          cp -R dist/. "release/remotes/consultingOpportunities/$VERSION/"

          printf '{"consultingOpportunities":"remotes/consultingOpportunities/%s/consultingOpportunitiesEntry.js"}\n' "$VERSION" \
            > "release/microfrontends-$VERSION.json"

          (cd release && zip -qr "../consulting-opportunities-$VERSION.zip" .)

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: consulting-opportunities-${{ steps.consulting-opportunities-version.outputs.version }}
          path: consulting-opportunities-${{ steps.consulting-opportunities-version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          VERSION: ${{ steps.consulting-opportunities-version.outputs.version }}
        run: |
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Published versions must not be reused."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

          echo "Created version tag $TAG"
