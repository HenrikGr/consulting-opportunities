name: Remote CI and Versioned Artifact

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.remote.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Read and validate remote configuration
        id: remote
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import process from 'node:process';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const repositoryName = process.env.GITHUB_REPOSITORY.split('/').at(-1);
          const version = packageJson.version;

          if (packageJson.name !== repositoryName) {
            console.error(`package.json name '${packageJson.name}' must match repository name '${repositoryName}'.`);
            process.exit(1);
          }

          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
            console.error(`package.json version '${version}' must use stable SemVer format X.Y.Z.`);
            process.exit(1);
          }

          const federationName = repositoryName.replace(/[-_.\s]+(.)?/g, (_, character) =>
            character ? character.toUpperCase() : '',
          );
          const entryFile = `${federationName}Entry.js`;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `repository_name=${repositoryName}`,
            `federation_name=${federationName}`,
            `entry_file=${entryFile}`,
            `version=${version}`,
          ].join('\n') + '\n');

          console.log(`Remote: ${repositoryName}`);
          console.log(`Federation identity: ${federationName}`);
          console.log(`Entry file: ${entryFile}`);
          console.log(`Version: ${version}`);
          NODE

      - name: Validate version against latest tag
        shell: bash
        env:
          VERSION: ${{ steps.remote.outputs.version }}
        run: |
          git fetch --tags --force

          TAGS="$(git tag --list 'v[0-9]*')"
          LATEST_TAG=""

          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              if [[ -z "$LATEST_TAG" ]] ||
                 [[ "$(printf '%s\n%s\n' "${LATEST_TAG#v}" "${TAG#v}" | sort -V | tail -n 1)" == "${TAG#v}" ]]; then
                LATEST_TAG="$TAG"
              fi
            fi
          done <<< "$TAGS"

          if [[ -z "$LATEST_TAG" ]]; then
            echo "No existing SemVer tag found. Version $VERSION can be the initial release."
            exit 0
          fi

          LATEST_VERSION="${LATEST_TAG#v}"
          echo "Latest tag: $LATEST_TAG"
          echo "package.json version: $VERSION"

          HIGHEST_VERSION="$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n 1)"
          if [[ "$HIGHEST_VERSION" != "$VERSION" || "$VERSION" == "$LATEST_VERSION" ]]; then
            echo "::error::Version $VERSION must be greater than latest tag $LATEST_TAG."
            exit 1
          fi

      - name: Build remote
        run: npm run build

      - name: Verify federation entry exists
        env:
          ENTRY_FILE: ${{ steps.remote.outputs.entry_file }}
        run: test -f "dist/$ENTRY_FILE"

      - name: Package versioned artifact
        shell: bash
        env:
          VERSION: ${{ steps.remote.outputs.version }}
          FEDERATION_NAME: ${{ steps.remote.outputs.federation_name }}
          ENTRY_FILE: ${{ steps.remote.outputs.entry_file }}
        run: |
          mkdir -p "release/remotes/$FEDERATION_NAME/$VERSION"
          cp -R dist/. "release/remotes/$FEDERATION_NAME/$VERSION/"

          printf '{"%s":"remotes/%s/%s/%s"}\n' \
            "$FEDERATION_NAME" "$FEDERATION_NAME" "$VERSION" "$ENTRY_FILE" \
            > "release/microfrontends-$VERSION.json"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.remote.outputs.repository_name }}-${{ steps.remote.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create version tag
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Published versions must not be reused."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"
          echo "Created version tag $TAG"
