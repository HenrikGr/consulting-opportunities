name: Remote CI and GitHub Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.remote.outputs.version }}
      repository_name: ${{ steps.remote.outputs.repository_name }}
      federation_name: ${{ steps.remote.outputs.federation_name }}
      entry_file: ${{ steps.remote.outputs.entry_file }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Read and validate remote configuration
        id: remote
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import process from 'node:process';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const repositoryName = process.env.GITHUB_REPOSITORY.split('/').at(-1);
          const version = packageJson.version;

          if (packageJson.name !== repositoryName) {
            console.error(`package.json name '${packageJson.name}' must match repository name '${repositoryName}'.`);
            process.exit(1);
          }

          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
            console.error(`package.json version '${version}' must use stable SemVer format X.Y.Z.`);
            process.exit(1);
          }

          const federationName = repositoryName.replace(/[-_.\s]+(.)?/g, (_, character) =>
            character ? character.toUpperCase() : '',
          );
          const entryFile = `${federationName}Entry.js`;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            `repository_name=${repositoryName}`,
            `federation_name=${federationName}`,
            `entry_file=${entryFile}`,
            `version=${version}`,
          ].join('\n') + '\n');
          NODE

      - name: Validate version against latest tag
        id: version
        shell: bash
        env:
          VERSION: ${{ steps.remote.outputs.version }}
        run: |
          git fetch --tags --force

          TAGS="$(git tag --list 'v[0-9]*')"
          LATEST_TAG=""

          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              if [[ -z "$LATEST_TAG" ]] ||
                 [[ "$(printf '%s\n%s\n' "${LATEST_TAG#v}" "${TAG#v}" | sort -V | tail -n 1)" == "${TAG#v}" ]]; then
                LATEST_TAG="$TAG"
              fi
            fi
          done <<< "$TAGS"

          if [[ -z "$LATEST_TAG" ]]; then
            echo "No existing SemVer tag found. Version $VERSION can be the initial release."
          else
            LATEST_VERSION="${LATEST_TAG#v}"
            echo "Latest tag: $LATEST_TAG"
            echo "package.json version: $VERSION"

            HIGHEST_VERSION="$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n 1)"
            if [[ "$HIGHEST_VERSION" != "$VERSION" || "$VERSION" == "$LATEST_VERSION" ]]; then
              echo "::error::Version $VERSION must be greater than latest tag $LATEST_TAG."
              exit 1
            fi
          fi

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Build remote for its versioned GitHub Release URL
        env:
          VITE_REMOTE_ASSET_BASE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.remote.outputs.version }}/
        run: npm run build

      - name: Remove generated type declarations from release payload
        run: rm -rf dist/@mf-types

      - name: Verify federation entry and flat release assets
        env:
          ENTRY_FILE: ${{ steps.remote.outputs.entry_file }}
        shell: bash
        run: |
          test -f "dist/$ENTRY_FILE"
          if find dist -mindepth 2 -type f -print -quit | grep -q .; then
            echo "::error::Runtime release assets must be in the dist root because GitHub Release assets do not preserve directory paths."
            find dist -mindepth 2 -type f
            exit 1
          fi

      # Retained for local development tooling; production distribution uses GitHub Releases.
      - name: Upload CI artifact for local development
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.remote.outputs.repository_name }}-${{ steps.remote.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built Remote files
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.repository_name }}-${{ needs.build.outputs.version }}
          path: dist

      - name: Create this Remote's manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          FEDERATION_NAME: ${{ needs.build.outputs.federation_name }}
          ENTRY_FILE: ${{ needs.build.outputs.entry_file }}
          PREVIOUS_TAG: ${{ needs.build.outputs.latest_tag }}
        run: |
          FALLBACK_TAG=""
          if [[ -n "$PREVIOUS_TAG" ]] &&
             gh release view "$PREVIOUS_TAG" --json assets --jq '.assets[].name' 2>/dev/null |
               grep -Fxq "$ENTRY_FILE"; then
            FALLBACK_TAG="$PREVIOUS_TAG"
          fi

          FALLBACK_TAG="$FALLBACK_TAG" node scripts/create-remote-manifest.mjs

      - name: Publish versioned Remote Release and manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.repository_name }} v${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*
            remote-manifest.json
